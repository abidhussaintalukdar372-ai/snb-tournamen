:root{--bg:#070b1a;--c:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eef1ff;--mu:#94a0c4;--g:#f5c451;--a:#7c5cff;--ok:#34d399;--no:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#3a2a9a55,transparent),radial-gradient(800px 500px at -10% 10%,#0e6b8f44,transparent),var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px}
header{padding:16px 14px 6px;text-align:center}h1{margin:0;font-size:24px;letter-spacing:1px;background:linear-gradient(90deg,#f5c451,#fff1c1,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:0;background:rgba(7,11,26,.88);backdrop-filter:blur(10px);z-index:5}nav button{flex:none;background:var(--c);border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px}nav button.on{background:linear-gradient(135deg,var(--a),#3b82f6);border-color:transparent}
main{padding:12px;max-width:760px;margin:auto}.c{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;padding:6px 2px}td,th{text-align:center}td{padding:8px 2px;border-top:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:left}td:nth-child(2){font-weight:600}tr.q td:first-child{box-shadow:inset 3px 0 var(--ok)}.pts{color:var(--g);font-weight:800}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding:10px 0;border-top:1px solid var(--bd)}.sc{font-size:22px;font-weight:800;color:var(--g);min-width:72px}.ev{grid-column:1/4;font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1px}.W{background:var(--ok)}.D{background:#9ca3af}.L{background:var(--no)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{text-align:center;padding:12px;border-radius:14px;background:linear-gradient(135deg,#7c5cff33,#0e6b8f33);border:1px solid var(--bd)}.st b{display:block;font-size:24px;color:var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.nt{border-left:3px solid var(--g);padding:8px 10px;margin:8px 0;background:rgba(245,196,81,.07);border-radius:0 10px 10px 0}.nt.pin{border-color:var(--no)}
input,select,textarea{background:#0f1630;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:14px;width:100%;margin:4px 0}button.b{background:linear-gradient(135deg,var(--a),#3b82f6);border:0;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;margin:3px 0}button.d{background:#7f1d1d}
.tk{background:linear-gradient(90deg,#7c5cff,#0e6b8f);overflow:hidden;white-space:nowrap;font-size:13px;padding:7px 0}.tk span{display:inline-block;padding-left:100%;animation:tk 25s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--c);color:var(--mu)}
@media(prefers-reduced-motion:reduce){.tk span{animation:none;padding:0}}

header{padding:18px 14px 8px}.hl{height:78px;width:78px;border-radius:16px;margin-bottom:6px;box-shadow:0 8px 26px rgba(124,92,255,.45)}
.pt{padding:0;overflow:hidden;border-color:rgba(245,196,81,.28);background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,.03));box-shadow:0 10px 34px rgba(0,0,0,.35)}
.pth{display:flex;justify-content:space-between;align-items:center;padding:14px 14px 11px;background:linear-gradient(90deg,rgba(124,92,255,.30),rgba(14,107,143,.24));border-bottom:1px solid var(--bd)}
.ptt{font-weight:800;letter-spacing:2.5px;font-size:15px;background:linear-gradient(90deg,#f5c451,#fff1c1);-webkit-background-clip:text;background-clip:text;color:transparent}
.lv{font-size:11px;color:var(--ok);letter-spacing:1px;font-weight:700}
.tw{overflow-x:auto}.tb{border-collapse:separate;border-spacing:0;min-width:100%}
.tb th{font-size:11px;letter-spacing:.8px;text-transform:uppercase;color:var(--mu);padding:9px 7px;background:rgba(0,0,0,.2);white-space:nowrap;font-weight:600}
.tb td{padding:9px 7px;border-top:1px solid var(--bd);font-variant-numeric:tabular-nums;white-space:nowrap}
.tb tr:hover td{background:rgba(255,255,255,.04)}
.tb .s1{position:sticky;left:0;z-index:2;width:40px;min-width:40px;background:#0d1330}
.tb .s2{position:sticky;left:40px;z-index:2;background:#0d1330;text-align:left;min-width:150px}
.tb tr:hover td.s1,.tb tr:hover td.s2{background:#151c42}
.tb tr.q td.s1{box-shadow:inset 3px 0 var(--ok)}
.tb.cp th,.tb.cp td{padding:9px 5px}.tb.cp .s2{min-width:0;width:100%}.tb.cp td.s2,.tb.cp td.s2 span{white-space:normal;line-height:1.2}
.tn{display:flex;align-items:center;gap:8px;font-weight:600}.cr{width:auto;object-fit:contain;filter:drop-shadow(0 2px 4px rgba(0,0,0,.45));flex:none}
.av{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;object-fit:cover;color:#fff;font-weight:800;flex:none;vertical-align:middle}
.rk{display:inline-flex;width:24px;height:24px;border-radius:50%;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--mu);flex:none}
.r1{background:linear-gradient(135deg,#f5c451,#b8860b);color:#1a1200}.r2{background:linear-gradient(135deg,#e5e7eb,#9ca3af);color:#111}.r3{background:linear-gradient(135deg,#d6935a,#8a5a2b);color:#1a0d00}
.pp{display:inline-block;min-width:34px;padding:3px 9px;border-radius:12px;background:linear-gradient(135deg,rgba(245,196,81,.28),rgba(245,196,81,.08));border:1px solid rgba(245,196,81,.45);color:var(--g);font-weight:800}
.up{color:var(--ok)}.dn{color:var(--no)}
.fm{display:flex;gap:3px;justify-content:center}.fm i{width:20px;height:20px;border-radius:6px;font-style:normal;font-size:11px;font-weight:700;display:flex;align-items:center;justify-content:center;color:#fff}
.fW{background:#16a34a}.fD{background:#6b7280}.fL{background:#dc2626}
.lg2{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:10px 14px;font-size:12px;color:var(--mu);border-top:1px solid var(--bd)}
.sq{display:inline-block;width:10px;height:10px;border-radius:3px;background:var(--ok);margin-right:6px}
.hero{background:linear-gradient(135deg,rgba(245,196,81,.16),rgba(124,92,255,.14));border-color:rgba(245,196,81,.35)}
.hl2{font-size:12px;letter-spacing:2px;color:var(--g);font-weight:800;margin-bottom:10px}
.hr{display:flex;gap:14px;align-items:center}.hr .av{border:3px solid var(--g);box-shadow:0 0 22px rgba(245,196,81,.35)}
.hn{font-size:20px;font-weight:800}.ht{display:flex;align-items:center;gap:6px;color:var(--mu);font-size:13px;margin:4px 0}
.lb{display:flex;align-items:center;gap:10px;padding:9px 0;border-top:1px solid var(--bd)}.ln{flex:1;display:flex;flex-direction:column;gap:3px;min-width:0}.ln .mu{display:flex;align-items:center;gap:6px}
.pill{padding:4px 10px;border-radius:12px;background:rgba(245,196,81,.15);border:1px solid rgba(245,196,81,.35);color:var(--g);font-weight:700;font-size:12px;white-space:nowrap}
.tc{display:flex;flex-direction:column;align-items:center;gap:5px}.mo{display:flex;justify-content:center;align-items:center;gap:6px}

const LOGO=[[/tiki/i,TIKI_LOGO]];
const ini=n=>(String(n).trim()[0]||'?').toUpperCase(),hue=n=>[...String(n)].reduce((a,c)=>a+c.charCodeAt(0),0)*37%360;
const okImg=i=>typeof i==='string'&&/^data:image\/(jpeg|png|webp);base64,/.test(i);
const ava=(p,img,sz)=>okImg(img)?'<img class="av" style="width:'+sz+'px;height:'+sz+'px" src="'+img+'" alt="">':'<span class="av" style="width:'+sz+'px;height:'+sz+'px;font-size:'+Math.round(sz*.45)+'px;background:linear-gradient(135deg,hsl('+hue(p)+' 60% 45%),hsl('+((hue(p)+40)%360)+' 60% 28%))">'+esc(ini(p))+'</span>';
const crest=(n,sz)=>{const l=LOGO.find(x=>x[0].test(n));return l?'<img class="cr" style="height:'+sz+'px" src="'+l[1]+'" alt="">':'<span class="av" style="width:'+sz+'px;height:'+sz+'px;border-radius:8px;font-size:'+Math.round(sz*.45)+'px;background:linear-gradient(135deg,hsl('+hue(n)+' 55% 42%),hsl('+((hue(n)+40)%360)+' 55% 28%))">'+esc(ini(String(n).replace(/^team\s+/i,'')))+'</span>'};
const photoOf=p=>{const a=M.filter(m=>m.mom&&String(m.mom.p).toLowerCase()===String(p).toLowerCase()&&okImg(m.mom.img)).sort((x,y)=>(y.ts||0)-(x.ts||0))[0];return a?a.mom.img:''};
const TABS=[['notice','📢 নোটিশ'],['home','🏠 হোম'],['table','📊 Table'],['matches','⚽ ম্যাচ'],['stats','🏅 স্ট্যাটস'],['admin','🔐 অ্যাডমিন']];
const teams=()=>T.length?T:[...new Set(SO.map(x=>x.team))];
const roster=t=>CR[t]&&CR[t].length?CR[t]:SO.filter(x=>x.team===t).map(x=>x.p);
const win=m=>m.hs>m.as?m.h:m.hs<m.as?m.a:(m.pw||null);
const L={league:'লীগ',sf:'সেমিফাইনাল',final:'ফাইনাল'};
function table(){const r={};teams().forEach(n=>r[n]={n,p:0,w:0,d:0,l:0,f:0,a:0,pt:0,fm:[]});M.filter(m=>m.stage==='league'&&m.st==='done').sort((x,y)=>(x.ts||0)-(y.ts||0)).forEach(m=>{const h=r[m.h],a=r[m.a];if(!h||!a)return;const hs=+m.hs,as=+m.as;h.p++;a.p++;h.f+=hs;h.a+=as;a.f+=as;a.a+=hs;const k=hs>as?['W','L',3,0]:hs<as?['L','W',0,3]:['D','D',1,1];h.fm.push(k[0]);a.fm.push(k[1]);h.pt+=k[2];a.pt+=k[3];h[k[0].toLowerCase()]++;a[k[1].toLowerCase()]++});return Object.values(r).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f||x.n.localeCompare(y.n))}
function stats(){const P={},C={};let last=null;const g=(p,t)=>P[p+'|'+t]||(P[p+'|'+t]={p,t,m:0,img:'',ts:0});M.filter(m=>m.st==='done').sort((x,y)=>(x.ts||0)-(y.ts||0)).forEach(m=>{if(m.mom&&m.mom.p){const x=g(m.mom.p,m.mom.t);x.m++;x.ts=m.ts||0;if(okImg(m.mom.img))x.img=m.mom.img;last={p:m.mom.p,t:m.mom.t,img:okImg(m.mom.img)?m.mom.img:'',m}};[[m.h,m.as,m.gkh],[m.a,m.hs,m.gka]].forEach(([t,c,k])=>{if(+c===0){const key=(k||t)+'|'+t;C[key]=C[key]||{p:k||'Goalkeeper',t,n:0};C[key].n++}})});if(last&&!last.img)last.img=photoOf(last.p);Object.values(P).forEach(x=>{if(!x.img)x.img=photoOf(x.p)});return{P:Object.values(P),C:Object.values(C),last}}
const top=(a,k,n=5)=>[...a].filter(x=>x[k]>0).sort((x,y)=>y[k]-x[k]).slice(0,n);
const lst=(t,a,k,u)=>'<div class="c"><h3>'+t+'</h3>'+(a.length?a.map((x,i)=>'<div class="row"><span>'+(['🥇','🥈','🥉'][i]||i+1+'.')+' <b>'+esc(x.p)+'</b> <span class="mu">'+esc(x.t)+'</span></span><b style="color:var(--g)">'+x[k]+' '+u+'</b></div>').join(''):'<div class="mu">এখনো ডেটা নেই</div>')+'</div>';
const dt=s=>s?String(s).replace('T',' '):'';
const motmHero=l=>'<div class="c hero"><div class="hl2">⭐ LATEST MOTM</div>'+(l?'<div class="hr">'+ava(l.p,l.img,84)+'<div><div class="hn">'+esc(l.p)+'</div><div class="ht">'+crest(l.t,18)+'<span>'+esc(l.t)+'</span></div><div class="mu">'+esc(l.m.h)+' '+l.m.hs+' - '+l.m.as+' '+esc(l.m.a)+'</div></div></div>':'<div class="mu">No MOTM awarded yet</div>')+'</div>';
const board=P=>{const a=P.filter(x=>x.m>0).sort((x,y)=>y.m-x.m||y.ts-x.ts).slice(0,10);return '<div class="c"><h3>🏅 MOTM Leaderboard</h3>'+(a.length?a.map((x,i)=>'<div class="lb"><span class="rk '+(i<3?'r'+(i+1):'')+'">'+(i+1)+'</span>'+ava(x.p,x.img,42)+'<div class="ln"><b>'+esc(x.p)+'</b><span class="mu">'+crest(x.t,14)+esc(x.t)+'</span></div><span class="pill">'+x.m+'× MOTM</span></div>').join(''):'<div class="mu">No MOTM awarded yet</div>')+'</div>'};

matches(){const f=k=>M.filter(m=>m.stage===k).sort((a,b)=>String(a.date||'~').localeCompare(String(b.date||'~'))||(a.ts||0)-(b.ts||0));return ['final','sf','league'].map(k=>f(k).length?'<div class="c"><h3>'+(k==='league'?'📅 লীগ ম্যাচ':k==='sf'?'🔥 সেমিফাইনাল':'🏆 ফাইনাল')+'</h3>'+f(k).map(mrow).join('')+'</div>':'').join('')||'<div class="c mu">এখনো কোনো ম্যাচ তৈরি হয়নি</div>'},

const tm=teams(),opt=(a,v)=>a.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');

['goals','assists'].forEach(k=>{h+=(ed[k]||[]).map((x,i)=>'<div class="row"><span>'+(k==='goals'?'⚽':'🅰️')+' '+esc(x.p)+' <span class="mu">'+esc(x.t)+'</span></span><button class="b d" onclick="rmEv(\''+k+'\','+i+')">✕</button></div>').join('')});
if(ed.mom&&ed.mom.p)h+='<div class="row"><span>'+ava(ed.mom.p,ed.mom.img,36)+' ⭐ MOTM: '+esc(ed.mom.p)+' <span class="mu">'+esc(ed.mom.t)+'</span></span><button class="b d" onclick="rmMom()">✕</button></div>';
h+='<div class="mu">গোলদাতা '+(ed.goals||[]).length+' / মোট গোল '+((+ed.hs||0)+(+ed.as||0))+'</div><button class="b" onclick="saveM()">💾 সেভ করুন</button> <button class="b d" onclick="delM()">ম্যাচ মুছুন</button>'}
h+='</div><div class="c"><h3>📢 নোটিশ দিন</h3><textarea id="nt" rows="3" placeholder="ঘোষণা লিখুন…"></textarea><label class="mu"><input type="checkbox" id="np" style="width:auto"> 📌 পিন করুন</label><br><button class="b" onclick="postN()">পোস্ট</button>'+N.map(x=>'<div class="row"><span>'+(x.pin?'📌 ':'')+esc(x.text.slice(0,60))+'</span><button class="b d" onclick="delN(\''+x.id+'\')">✕</button></div>').join('')+'</div>';
h+='<div class="c"><h3>⚙️ সেটআপ</h3><textarea id="tl" rows="8" placeholder="প্রতি লাইনে একটা টিমের নাম">'+esc(tm.join('\n'))+'</textarea><button class="b" onclick="saveT()">টিম সেভ</button> <button class="b" onclick="fromAuction()">অকশন থেকে টিম ও স্কোয়াড নিন</button><br><button class="b" onclick="loadTest()">🧪 টেস্ট ডেটা লোড (৮ টিম + ৬০ প্লেয়ার)</button> <button class="b d" onclick="clearAll()">🧹 সব মুছুন</button><hr style="border-color:var(--bd)"><button class="b" onclick="genFix()">📅 লীগ ফিক্সচার তৈরি ('+(tm.length*(tm.length-1)/2)+'টি)</button><br><button class="b" onclick="genSF()">🔥 সেমিফাইনাল তৈরি (টেবিলের ১-৪)</button><br><button class="b" onclick="genFin()">🏆 ফাইনাল তৈরি</button></div>';return h}};
function draw(){$('nav').innerHTML=TABS.map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('');$('app').innerHTML=V[tab]();const p=N.filter(x=>x.pin).concat(N.filter(x=>!x.pin)).slice(0,4);$('tk').style.display=p.length?'block':'none';$('tk').innerHTML=p.length?'<span>📢 '+p.map(x=>esc(x.text)).join(' &nbsp;•&nbsp; ')+'</span>':''}

window.postN=async()=>{const t=$('nt').value.trim();if(!t)return;await addDoc(collection(db,'t_notices'),{text:t,pin:$('np').checked,ts:Date.now()});dr(1)};

const fit=(file,px=240)=>new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(i.width,i.height),sy=(i.height-s)*.2,c=document.createElement('canvas');c.width=c.height=px;c.getContext('2d').drawImage(i,(i.width-s)/2,sy,s,s,0,0,px,px);res(c.toDataURL('image/jpeg',.82))};i.onerror=rej;i.src=r.result};r.onerror=rej;r.readAsDataURL(file)});
