<!DOCTYPE html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>SNB Tournament</title><style>
:root{--bg:#070b1a;--c:rgba(255,255,255,.06);--bd:rgba(255,255,255,.1);--tx:#eef1ff;--mu:#94a0c4;--g:#f5c451;--a:#7c5cff;--ok:#34d399;--no:#f87171}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,"Noto Sans Bengali",sans-serif;background:radial-gradient(1000px 500px at 85% -10%,#3a2a9a55,transparent),radial-gradient(800px 500px at -10% 10%,#0e6b8f44,transparent),var(--bg);color:var(--tx);min-height:100vh;padding-bottom:40px}
header{padding:16px 14px 6px;text-align:center}h1{margin:0;font-size:24px;letter-spacing:1px;background:linear-gradient(90deg,#f5c451,#fff1c1,#f5c451);-webkit-background-clip:text;background-clip:text;color:transparent}.sub{color:var(--mu);font-size:13px}
nav{display:flex;gap:6px;overflow-x:auto;padding:8px 12px;position:sticky;top:0;background:rgba(7,11,26,.88);backdrop-filter:blur(10px);z-index:5}nav button{flex:none;background:var(--c);border:1px solid var(--bd);color:var(--tx);padding:8px 14px;border-radius:20px;font-size:14px}nav button.on{background:linear-gradient(135deg,var(--a),#3b82f6);border-color:transparent}
main{padding:12px;max-width:760px;margin:auto}.c{background:var(--c);border:1px solid var(--bd);border-radius:16px;padding:14px;margin-bottom:12px;backdrop-filter:blur(8px)}h3{margin:0 0 10px;font-size:16px}.mu{color:var(--mu);font-size:13px}
table{width:100%;border-collapse:collapse;font-size:13px}th{color:var(--mu);font-weight:500;padding:6px 2px}td,th{text-align:center}td{padding:8px 2px;border-top:1px solid var(--bd)}td:nth-child(2),th:nth-child(2){text-align:left}td:nth-child(2){font-weight:600}tr.q td:first-child{box-shadow:inset 3px 0 var(--ok)}.pts{color:var(--g);font-weight:800}
.m{display:grid;grid-template-columns:1fr auto 1fr;gap:8px;align-items:center;text-align:center;padding:10px 0;border-top:1px solid var(--bd)}.sc{font-size:22px;font-weight:800;color:var(--g);min-width:72px}.ev{grid-column:1/4;font-size:12px;color:var(--mu)}
.dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin:0 1px}.W{background:var(--ok)}.D{background:#9ca3af}.L{background:var(--no)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.st{text-align:center;padding:12px;border-radius:14px;background:linear-gradient(135deg,#7c5cff33,#0e6b8f33);border:1px solid var(--bd)}.st b{display:block;font-size:24px;color:var(--g)}
.row{display:flex;justify-content:space-between;gap:8px;padding:7px 0;border-top:1px solid var(--bd);font-size:14px}.nt{border-left:3px solid var(--g);padding:8px 10px;margin:8px 0;background:rgba(245,196,81,.07);border-radius:0 10px 10px 0}.nt.pin{border-color:var(--no)}
input,select,textarea{background:#0f1630;border:1px solid var(--bd);color:var(--tx);border-radius:10px;padding:10px;font-size:14px;width:100%;margin:4px 0}button.b{background:linear-gradient(135deg,var(--a),#3b82f6);border:0;color:#fff;padding:10px 16px;border-radius:10px;font-size:14px;margin:3px 0}button.d{background:#7f1d1d}
.tk{background:linear-gradient(90deg,#7c5cff,#0e6b8f);overflow:hidden;white-space:nowrap;font-size:13px;padding:7px 0}.tk span{display:inline-block;padding-left:100%;animation:tk 25s linear infinite}@keyframes tk{to{transform:translateX(-100%)}}.tag{font-size:11px;padding:2px 8px;border-radius:10px;background:var(--c);color:var(--mu)}
@media(prefers-reduced-motion:reduce){.tk span{animation:none;padding:0}}
</style></head><body>
<div id="tk" class="tk" style="display:none"></div><header><h1>🏆 SNB TOURNAMENT</h1><div class="sub">Sylhet Netbreakers · লাইভ পয়েন্ট টেবিল ও স্ট্যাটস</div></header><nav id="nav"></nav><main id="app"></main>
<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getFirestore,collection,doc,setDoc,deleteDoc,addDoc,onSnapshot,writeBatch} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
import {getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
const FB={apiKey:"AIzaSyB-OSFS4XGBtbVKb6sD7x5XD9qWHmZbCyk",authDomain:"club-auction.firebaseapp.com",projectId:"club-auction",storageBucket:"club-auction.firebasestorage.app",messagingSenderId:"349450623092",appId:"1:349450623092:web:1e5ab4b27cd275084b5921"};
const app=initializeApp(FB),db=getFirestore(app),au=getAuth(app),$=i=>document.getElementById(i),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let T=[],M=[],N=[],SO=[],CR={},U=null,tab='notice',ed=null;
const TABS=[['notice','📢 নোটিশ'],['home','🏠 হোম'],['table','📊 টেবিল'],['matches','⚽ ম্যাচ'],['stats','🏅 স্ট্যাটস'],['admin','🔐 অ্যাডমিন']];
const teams=()=>T.length?T:[...new Set(SO.map(x=>x.team))];
const roster=t=>CR[t]&&CR[t].length?CR[t]:SO.filter(x=>x.team===t).map(x=>x.p);
const win=m=>m.hs>m.as?m.h:m.hs<m.as?m.a:(m.pw||null);
const L={league:'লীগ',sf:'সেমিফাইনাল',final:'ফাইনাল'};
function table(){const r={};teams().forEach(n=>r[n]={n,p:0,w:0,d:0,l:0,f:0,a:0,pt:0,fm:[]});M.filter(m=>m.stage==='league'&&m.st==='done').sort((x,y)=>(x.ts||0)-(y.ts||0)).forEach(m=>{const h=r[m.h],a=r[m.a];if(!h||!a)return;const hs=+m.hs,as=+m.as;h.p++;a.p++;h.f+=hs;h.a+=as;a.f+=as;a.a+=hs;const k=hs>as?['W','L',3,0]:hs<as?['L','W',0,3]:['D','D',1,1];h.fm.push(k[0]);a.fm.push(k[1]);h.pt+=k[2];a.pt+=k[3];h[k[0].toLowerCase()]++;a[k[1].toLowerCase()]++});return Object.values(r).sort((x,y)=>y.pt-x.pt||(y.f-y.a)-(x.f-x.a)||y.f-x.f||x.n.localeCompare(y.n))}
function stats(){const P={},C={},g=(p,t)=>P[p+'|'+t]||(P[p+'|'+t]={p,t,g:0,a:0,m:0});M.filter(m=>m.st==='done').forEach(m=>{(m.goals||[]).forEach(x=>g(x.p,x.t).g++);(m.assists||[]).forEach(x=>g(x.p,x.t).a++);if(m.mom&&m.mom.p)g(m.mom.p,m.mom.t).m++;[[m.h,m.as,m.gkh],[m.a,m.hs,m.gka]].forEach(([t,c,k])=>{if(+c===0){const key=(k||t)+'|'+t;C[key]=C[key]||{p:k||'গোলকিপার',t,n:0};C[key].n++}})});return{P:Object.values(P).map(x=>({...x,s:x.g*3+x.a*2+x.m*5})),C:Object.values(C)}}
const top=(a,k,n=5)=>[...a].filter(x=>x[k]>0).sort((x,y)=>y[k]-x[k]).slice(0,n);
const lst=(t,a,k,u)=>'<div class="c"><h3>'+t+'</h3>'+(a.length?a.map((x,i)=>'<div class="row"><span>'+(['🥇','🥈','🥉'][i]||i+1+'.')+' <b>'+esc(x.p)+'</b> <span class="mu">'+esc(x.t)+'</span></span><b style="color:var(--g)">'+x[k]+' '+u+'</b></div>').join(''):'<div class="mu">এখনো ডেটা নেই</div>')+'</div>';
const dt=s=>s?String(s).replace('T',' '):'';
function mrow(m){const done=m.st==='done',ev=[...(m.goals||[]).map(x=>'⚽ '+esc(x.p)),...(m.assists||[]).map(x=>'🅰️ '+esc(x.p))].join(' · ');return '<div class="m"><b>'+esc(m.h)+'</b><div class="sc">'+(done?m.hs+' - '+m.as:'vs')+'</div><b>'+esc(m.a)+'</b>'+(done&&m.stage!=='league'&&m.hs==m.as&&m.pw?'<div class="ev">পেনাল্টিতে জিতেছে: '+esc(m.pw)+'</div>':'')+'<div class="ev">'+L[m.stage]+(m.date?' · '+dt(m.date):'')+(done&&m.mom&&m.mom.p?' · ⭐ '+esc(m.mom.p):'')+(ev?'<br>'+ev:'')+'</div></div>'}
function tbl(t,n){return '<table><tr><th>#</th><th>টিম</th><th>খে</th><th>জ</th><th>ড্র</th><th>হা</th><th>GD</th><th>পয়েন্ট</th>'+(n?'':'<th>ফর্ম</th>')+'</tr>'+t.map((x,i)=>'<tr class="'+(i<4?'q':'')+'"><td>'+(i+1)+'</td><td>'+esc(x.n)+'</td><td>'+x.p+'</td><td>'+x.w+'</td><td>'+x.d+'</td><td>'+x.l+'</td><td>'+(x.f-x.a)+'</td><td class="pts">'+x.pt+'</td>'+(n?'':'<td>'+x.fm.slice(-5).map(f=>'<i class="dot '+f+'"></i>').join('')+'</td>')+'</tr>').join('')+'</table><div class="mu" style="margin-top:8px">🟩 প্রথম ৪ টিম সেমিফাইনালে</div>'}
function notes(n){return N.slice(0,n).map(x=>'<div class="nt'+(x.pin?' pin':'')+'">'+(x.pin?'📌 ':'')+esc(x.text)+'<div class="mu">'+new Date(x.ts).toLocaleString('bn-BD')+'</div></div>').join('')||'<div class="mu">কোনো নোটিশ নেই</div>'}
const V={
home(){const t=table(),s=stats(),d=M.filter(m=>m.st==='done'),up=M.filter(m=>m.st!=='done').sort((a,b)=>String(a.date||'~').localeCompare(String(b.date||'~'))).slice(0,3),gl=d.reduce((a,m)=>a+(+m.hs)+(+m.as),0);return '<div class="c"><h3>📢 নোটিশ বোর্ড</h3>'+notes(3)+'</div><div class="g2" style="margin-bottom:12px"><div class="st"><b>'+d.length+'/'+M.length+'</b>ম্যাচ শেষ</div><div class="st"><b>'+gl+'</b>মোট গোল</div><div class="st"><b>'+(d.length?(gl/d.length).toFixed(1):'0')+'</b>গড় গোল/ম্যাচ</div><div class="st"><b>'+teams().length+'</b>টিম</div></div><div class="c"><h3>📊 পয়েন্ট টেবিল</h3>'+tbl(t,1)+'</div>'+(up.length?'<div class="c"><h3>⏭ আসছে ম্যাচ</h3>'+up.map(mrow).join('')+'</div>':'')+(d.length?'<div class="c"><h3>✅ শেষ ফলাফল</h3>'+[...d].sort((a,b)=>(b.ts||0)-(a.ts||0)).slice(0,3).map(mrow).join('')+'</div>':'')+lst('⚽ টপ স্কোরার',top(s.P,'g',3),'g','গোল')},
table(){return '<div class="c"><h3>📊 পয়েন্ট টেবিল</h3>'+tbl(table())+'</div>'},
matches(){const f=k=>M.filter(m=>m.stage===k).sort((a,b)=>String(a.date||'~').localeCompare(String(b.date||'~'))||(a.ts||0)-(b.ts||0));return ['final','sf','league'].map(k=>f(k).length?'<div class="c"><h3>'+(k==='league'?'📅 লীগ ম্যাচ':k==='sf'?'🔥 সেমিফাইনাল':'🏆 ফাইনাল')+'</h3>'+f(k).map(mrow).join('')+'</div>':'').join('')||'<div class="c mu">এখনো কোনো ম্যাচ তৈরি হয়নি</div>'},
stats(){const s=stats();return lst('👑 টপ প্লেয়ার <span class="mu">(গোল×৩ + অ্যাসিস্ট×২ + MOM×৫)</span>',top(s.P,'s'),'s','পয়েন্ট')+lst('⚽ টপ স্কোরার',top(s.P,'g'),'g','গোল')+lst('🅰️ সবচেয়ে বেশি অ্যাসিস্ট',top(s.P,'a'),'a','অ্যাসিস্ট')+lst('⭐ Man of the Match',top(s.P,'m'),'m','বার')+lst('🧤 মোস্ট ক্লিন শিট',top(s.C,'n'),'n','ক্লিন শিট')},
notice(){return '<div class="c"><h3>📢 নোটিশ বোর্ড</h3>'+notes(50)+'</div>'},
admin(){if(!U)return '<div class="c"><h3>🔐 অ্যাডমিন লগইন</h3><input id="em" type="email" placeholder="ইমেইল" autocapitalize="off" autocorrect="off" autocomplete="username"><input id="pw" type="password" placeholder="পাসওয়ার্ড" autocapitalize="off" autocomplete="current-password"><button class="b" onclick="login()">লগইন</button></div>';
const tm=teams(),opt=(a,v)=>a.map(x=>'<option'+(x===v?' selected':'')+'>'+esc(x)+'</option>').join('');
let h='<div class="c"><b>'+esc(U.email)+'</b> <button class="b d" onclick="signOutA()">লগআউট</button></div>';
h+='<div class="c"><h3>📝 ম্যাচ আপডেট</h3><select id="ms" onchange="pickM(this.value)"><option value="">— ম্যাচ বাছুন —</option>'+M.map(m=>'<option value="'+m.id+'"'+(ed&&ed.id===m.id?' selected':'')+'>'+(m.st==='done'?'✅ ':'')+esc(m.h)+' vs '+esc(m.a)+' ('+L[m.stage]+')</option>').join('')+'</select>';
if(ed){h+='<div class="g2"><input id="hs" type="number" min="0" placeholder="'+esc(ed.h)+' গোল" value="'+(ed.hs??'')+'"><input id="as" type="number" min="0" placeholder="'+esc(ed.a)+' গোল" value="'+(ed.as??'')+'"></div><input id="dt" type="datetime-local" value="'+(ed.date||'')+'"><div class="g2"><input id="gkh" placeholder="'+esc(ed.h)+' গোলকিপার" value="'+esc(ed.gkh||'')+'"><input id="gka" placeholder="'+esc(ed.a)+' গোলকিপার" value="'+esc(ed.gka||'')+'"></div><select id="stt"><option value="up"'+(ed.st!=='done'?' selected':'')+'>⏳ হয়নি/চলছে</option><option value="done"'+(ed.st==='done'?' selected':'')+'>✅ শেষ</option></select>'+(ed.stage!=='league'?'<select id="pw"><option value="">পেনাল্টি বিজয়ী (ড্র হলে)</option>'+opt([ed.h,ed.a],ed.pw)+'</select>':'')+'<hr style="border-color:var(--bd)"><select id="et" onchange="fillPl()">'+opt([ed.h,ed.a])+'</select><input id="ep" list="pl" placeholder="প্লেয়ারের নাম"><datalist id="pl">'+roster(ed.h).map(p=>'<option>'+esc(p)).join('')+'</datalist><button class="b" onclick="addEv(\'goals\')">+ গোল</button> <button class="b" onclick="addEv(\'assists\')">+ অ্যাসিস্ট</button> <button class="b" onclick="addEv(\'mom\')">⭐ MOM</button>';
['goals','assists'].forEach(k=>{h+=(ed[k]||[]).map((x,i)=>'<div class="row"><span>'+(k==='goals'?'⚽':'🅰️')+' '+esc(x.p)+' <span class="mu">'+esc(x.t)+'</span></span><button class="b d" onclick="rmEv(\''+k+'\','+i+')">✕</button></div>').join('')});
if(ed.mom&&ed.mom.p)h+='<div class="row"><span>⭐ '+esc(ed.mom.p)+' <span class="mu">'+esc(ed.mom.t)+'</span></span></div>';
h+='<div class="mu">গোলদাতা '+(ed.goals||[]).length+' / মোট গোল '+((+ed.hs||0)+(+ed.as||0))+'</div><button class="b" onclick="saveM()">💾 সেভ করুন</button> <button class="b d" onclick="delM()">ম্যাচ মুছুন</button>'}
h+='</div><div class="c"><h3>📢 নোটিশ দিন</h3><textarea id="nt" rows="3" placeholder="ঘোষণা লিখুন…"></textarea><label class="mu"><input type="checkbox" id="np" style="width:auto"> 📌 পিন করুন</label><br><button class="b" onclick="postN()">পোস্ট</button>'+N.map(x=>'<div class="row"><span>'+(x.pin?'📌 ':'')+esc(x.text.slice(0,60))+'</span><button class="b d" onclick="delN(\''+x.id+'\')">✕</button></div>').join('')+'</div>';
h+='<div class="c"><h3>⚙️ সেটআপ</h3><textarea id="tl" rows="8" placeholder="প্রতি লাইনে একটা টিমের নাম">'+esc(tm.join('\n'))+'</textarea><button class="b" onclick="saveT()">টিম সেভ</button> <button class="b" onclick="fromAuction()">অকশন থেকে টিম ও স্কোয়াড নিন</button><br><button class="b" onclick="loadTest()">🧪 টেস্ট ডেটা লোড (৮ টিম + ৬০ প্লেয়ার)</button> <button class="b d" onclick="clearAll()">🧹 সব মুছুন</button><hr style="border-color:var(--bd)"><button class="b" onclick="genFix()">📅 লীগ ফিক্সচার তৈরি ('+(tm.length*(tm.length-1)/2)+'টি)</button><br><button class="b" onclick="genSF()">🔥 সেমিফাইনাল তৈরি (টেবিলের ১-৪)</button><br><button class="b" onclick="genFin()">🏆 ফাইনাল তৈরি</button></div>';return h}};
function draw(){$('nav').innerHTML=TABS.map(([k,l])=>'<button class="'+(tab===k?'on':'')+'" onclick="go(\''+k+'\')">'+l+'</button>').join('');$('app').innerHTML=V[tab]();const p=N.filter(x=>x.pin).concat(N.filter(x=>!x.pin)).slice(0,4);$('tk').style.display=p.length?'block':'none';$('tk').innerHTML=p.length?'<span>📢 '+p.map(x=>esc(x.text)).join(' &nbsp;•&nbsp; ')+'</span>':''}
const dr=f=>{if(tab==='admin'&&U&&!f&&(ed||/INPUT|TEXTAREA|SELECT/.test((document.activeElement||{}).tagName||'')))return;draw()};
window.go=t=>{tab=t;draw();scrollTo(0,0)};
window.login=()=>signInWithEmailAndPassword(au,$('em').value.trim(),$('pw').value).catch(e=>alert('লগইন হয়নি। এরর কোড: '+(e.code||e.message)));window.signOutA=()=>signOut(au);
const sync=()=>{if(!ed||!$('hs'))return;ed.hs=$('hs').value;ed.as=$('as').value;ed.date=$('dt').value;ed.gkh=$('gkh').value;ed.gka=$('gka').value;ed.st=$('stt').value;if($('pw'))ed.pw=$('pw').value};
window.pickM=id=>{ed=id?JSON.parse(JSON.stringify(M.find(m=>m.id===id))):null;dr(1)};
window.fillPl=()=>{$('pl').innerHTML=roster($('et').value).map(p=>'<option>'+esc(p)).join('')};
window.addEv=k=>{sync();const p=$('ep').value.trim(),t=$('et').value;if(!p)return alert('প্লেয়ারের নাম দিন');if(k==='mom')ed.mom={p,t};else(ed[k]=ed[k]||[]).push({p,t});dr(1)};
window.rmEv=(k,i)=>{sync();ed[k].splice(i,1);dr(1)};
window.saveM=async()=>{sync();const m={...ed};delete m.id;m.hs=+m.hs||0;m.as=+m.as||0;m.ts=Date.now();await setDoc(doc(db,'t_matches',ed.id),m);alert('সেভ হয়েছে');dr(1)};
window.delM=async()=>{if(confirm('এই ম্যাচ মুছবেন?')){await deleteDoc(doc(db,'t_matches',ed.id));ed=null;dr(1)}};
window.postN=async()=>{const t=$('nt').value.trim();if(!t)return;await addDoc(collection(db,'t_notices'),{text:t,pin:$('np').checked,ts:Date.now()});dr(1)};
window.delN=async id=>{await deleteDoc(doc(db,'t_notices',id))};
window.saveT=async()=>{const a=$('tl').value.split('\n').map(x=>x.trim()).filter(Boolean);await setDoc(doc(db,'t_cfg','main'),{teams:a},{merge:true});alert('টিম সেভ হয়েছে')};

window.loadTest=async()=>{if(!confirm('৮টি টেস্ট টিম ও ৬০ প্লেয়ার লোড হবে। এগিয়ে যাবেন?'))return;const r={};TT.forEach(x=>r[x]=[]);TP.forEach((p,i)=>r[TT[i%TT.length]].push(p));await setDoc(doc(db,'t_cfg','main'),{teams:TT,roster:r});alert('টেস্ট টিম ও প্লেয়ার লোড হয়েছে')};
window.clearAll=async()=>{if(!confirm('সব ম্যাচ, নোটিশ ও টিম সেটআপ মুছে যাবে। নিশ্চিত?'))return;const b=writeBatch(db);M.forEach(m=>b.delete(doc(db,'t_matches',m.id)));N.forEach(n=>b.delete(doc(db,'t_notices',n.id)));b.delete(doc(db,'t_cfg','main'));await b.commit();ed=null;alert('সব মুছে গেছে')};
window.genFix=async()=>{const t=teams();if(t.length<2)return alert('আগে টিম সেভ করুন');if(M.some(m=>m.stage==='league')&&!confirm('লীগ ম্যাচ আগে থেকেই আছে। আবার তৈরি করলে একই আইডির ম্যাচ মুছে যাবে। এগিয়ে যাবেন?'))return;const b=writeBatch(db);let k=0;for(let i=0;i<t.length;i++)for(let j=i+1;j<t.length;j++){k++;b.set(doc(db,'t_matches','L'+String(k).padStart(2,'0')),{h:t[i],a:t[j],hs:0,as:0,st:'up',stage:'league',ts:Date.now()+k})}await b.commit();alert(k+'টি ম্যাচ তৈরি হয়েছে')};
window.genSF=async()=>{const t=table();if(t.length<4)return alert('কমপক্ষে ৪টি টিম লাগবে');if(M.filter(m=>m.stage==='league'&&m.st!=='done').length&&!confirm('সব লীগ ম্যাচ এখনো শেষ হয়নি। তবুও তৈরি করবেন?'))return;await setDoc(doc(db,'t_matches','SF1'),{h:t[0].n,a:t[3].n,hs:0,as:0,st:'up',stage:'sf',ts:Date.now()});await setDoc(doc(db,'t_matches','SF2'),{h:t[1].n,a:t[2].n,hs:0,as:0,st:'up',stage:'sf',ts:Date.now()+1});alert('সেমিফাইনাল তৈরি হয়েছে')};
window.genFin=async()=>{const a=M.find(m=>m.id==='SF1'),b=M.find(m=>m.id==='SF2');if(!a||!b||a.st!=='done'||b.st!=='done'||!win(a)||!win(b))return alert('দুটি সেমিফাইনাল শেষ করে বিজয়ী ঠিক করুন (ড্র হলে পেনাল্টি বিজয়ী দিন)');await setDoc(doc(db,'t_matches','FIN'),{h:win(a),a:win(b),hs:0,as:0,st:'up',stage:'final',ts:Date.now()});alert('ফাইনাল তৈরি হয়েছে')};

onSnapshot(doc(db,'t_cfg','main'),s=>{T=s.exists()?s.data().teams||[]:[];CR=s.exists()?s.data().roster||{}:{};dr()},err);
onSnapshot(collection(db,'t_matches'),s=>{M=s.docs.map(d=>({id:d.id,...d.data()}));dr()},err);
onSnapshot(collection(db,'t_notices'),s=>{N=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.pin?1:0)-(a.pin?1:0)||b.ts-a.ts);dr()},err);
onSnapshot(collection(db,'sold'),s=>{SO=s.docs.map(d=>d.data());dr()},err);
